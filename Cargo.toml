# Standalone workspace root. This is its own project; the empty table stops
# cargo from walking up the directory tree and adopting an unrelated parent
# manifest as its workspace.
[workspace]

[package]
name = "saehrimnir"
version = "0.0.0"
edition = "2024"
description = "Deterministic mock JMAP server for testing ratatoskr's sync code."
license = "Apache-2.0 OR MIT"

[[bin]]
name = "saehrimnir"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util", "net", "sync", "time"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dellingr = "0.3.0"
rand = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14.8", default-features = false, features = ["pem", "ring"] }
mail-parser = "0.11.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json"] }
libc = "0.2"

[lints.clippy]
# Style: modern idiomatic Rust
uninlined_format_args = "deny"
cloned_instead_of_copied = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
manual_string_new = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"
unnecessary_sort_by = "deny"
collapsible_match = "deny"
if_same_then_else = "deny"
needless_borrow = "deny"
ptr_arg = "deny"
redundant_locals = "deny"
regex_creation_in_loops = "deny"
unnecessary_unwrap = "deny"
wrong_self_convention = "deny"

# Safety: strict error handling
unwrap_in_result = "deny"
ok_expect = "deny"
unwrap_used = "deny"

# Async safety
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

# Type safety
large_enum_variant = "deny"
clone_on_ref_ptr = "deny"
float_cmp = "deny"
cast_sign_loss = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"

# Safety: no debug/placeholder code in production
dbg_macro = "deny"
todo = "deny"
