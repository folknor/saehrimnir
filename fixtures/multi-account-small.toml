name = "multi-account-small"

# Two declared accounts, each with its own mailbox + email. Stage 2
# of the multi-account refactor lets JMAP advertise both accounts
# in the session resource and lets method handlers scope by
# `accountId`. Non-JMAP protocols (Graph `/me/...`, IMAP, SMTP,
# Gmail, gcal, People) still scope to the primary account; Stage 3
# adds per-account routing for them.

[[account]]
id = "account-primary"
name = "primary@example.com"
is_personal = true
primary = true

[[account]]
id = "account-secondary"
name = "secondary@example.com"
is_personal = true

# Primary's resources. Mailboxes default to the primary account
# (no `account_id` field needed) but we set it explicitly to
# exercise the loader's account_id-validation path.

[[mailbox]]
id = "mbx-primary-inbox"
account_id = "account-primary"
name = "Inbox"
role = "inbox"
sort_order = 0

[[email]]
id = "email-primary-001"
mailbox_ids = ["mbx-primary-inbox"]
received_at = "2026-01-15T10:00:00Z"
from = "sender@example.com"
to = ["primary@example.com"]
subject = "Hello primary"
body_text = "Primary account inbox email."

# Secondary's resources. JMAP and Graph route to these via
# `accountId` / `/v1.0/users/{id}/...`; other listeners ignore them.

[[mailbox]]
id = "mbx-secondary-inbox"
account_id = "account-secondary"
name = "Inbox"
role = "inbox"
sort_order = 0

[[email]]
id = "email-secondary-001"
mailbox_ids = ["mbx-secondary-inbox"]
received_at = "2026-01-20T11:00:00Z"
from = "elsewhere@example.com"
to = ["secondary@example.com"]
subject = "Hello secondary"
body_text = "Secondary account inbox email."

# Calendar resources, one per account. Used by the Stage 3 Graph
# calendar tests that hit `/v1.0/users/{account-secondary}/calendars`.

[[calendar]]
id = "cal-primary"
account_id = "account-primary"
name = "Primary Work"
is_default = true

[[event]]
id = "ev-primary-001"
calendar_id = "cal-primary"
subject = "Primary standup"
start = "2026-02-01T09:00:00Z"
end = "2026-02-01T09:30:00Z"

[[calendar]]
id = "cal-secondary"
account_id = "account-secondary"
name = "Secondary Work"

[[event]]
id = "ev-secondary-001"
calendar_id = "cal-secondary"
subject = "Secondary review"
start = "2026-02-05T14:00:00Z"
end = "2026-02-05T15:00:00Z"

# Contacts. One folder + contact per account.

[[contact_folder]]
id = "cf-primary"
account_id = "account-primary"
display_name = "Primary Contacts"
is_default = true

[[contact]]
id = "contact-primary-001"
folder_id = "cf-primary"
display_name = "Alice (primary)"
emails = ["alice@example.com"]

[[contact_folder]]
id = "cf-secondary"
account_id = "account-secondary"
display_name = "Secondary Contacts"

[[contact]]
id = "contact-secondary-001"
folder_id = "cf-secondary"
display_name = "Bob (secondary)"
emails = ["bob@example.com"]

# Categories.

[[category]]
id = "cat-primary-work"
account_id = "account-primary"
display_name = "Primary-Work"
color = "preset0"

[[category]]
id = "cat-secondary-urgent"
account_id = "account-secondary"
display_name = "Secondary-Urgent"
color = "preset5"
