name = "shared-rights"

# Shared-access rights, staged at two different levels in ONE fixture so
# a consumer has to actually read the rights rather than assume them.
#
# IMAP (other-users namespace, RFC 2342 + 4314):
#   #user/bob@example.com/INBOX     lr            read-only
#   #user/bob@example.com/Projects  lrswipkxte    writable
#
# EWS (org-wide public folders):
#   Team Notices  (pf-notices)  read-only  (default effective_rights)
#   Team Drafts   (pf-drafts)   writable
#
# JMAP: `account-team` is declared `is_personal = false` - a foreign /
# shared mailbox rather than the authenticating user's own store. It
# surfaces as `isPersonal: false` in the session's `accounts` map.

[[account]]
id = "account-alice"
name = "alice@example.com"
is_personal = true
primary = true

[[account]]
id = "account-bob"
name = "bob@example.com"
is_personal = true

[[account]]
id = "account-team"
name = "team@example.com"
is_personal = false

# Alice's own inbox.

[[mailbox]]
id = "mbx-alice-inbox"
account_id = "account-alice"
name = "Inbox"
role = "inbox"
sort_order = 0

[[email]]
id = "email-alice-001"
mailbox_ids = ["mbx-alice-inbox"]
received_at = "2026-01-15T10:00:00Z"
from = "sender@example.com"
to = ["alice@example.com"]
subject = "Alice private"
body_text = "Alice's own inbox email."

# Bob's two mailboxes. The inbox is shared read-only, Projects writable.

[[mailbox]]
id = "mbx-bob-inbox"
account_id = "account-bob"
name = "Inbox"
role = "inbox"
sort_order = 0

[[mailbox]]
id = "mbx-bob-projects"
account_id = "account-bob"
name = "Projects"
sort_order = 1

[[email]]
id = "email-bob-001"
mailbox_ids = ["mbx-bob-inbox"]
received_at = "2026-01-20T11:00:00Z"
from = "elsewhere@example.com"
to = ["bob@example.com"]
subject = "Bob shared readonly"
body_text = "Bob's read-only shared inbox email."

[[email]]
id = "email-bob-002"
mailbox_ids = ["mbx-bob-projects"]
received_at = "2026-01-21T11:00:00Z"
from = "elsewhere@example.com"
to = ["bob@example.com"]
subject = "Bob shared writable"
body_text = "Bob's writable shared folder email."

# The shared-mailbox account's own inbox, so it is a real account and
# not just a name in the session.

[[mailbox]]
id = "mbx-team-inbox"
account_id = "account-team"
name = "Inbox"
role = "inbox"
sort_order = 0

[[email]]
id = "email-team-001"
mailbox_ids = ["mbx-team-inbox"]
received_at = "2026-01-22T09:00:00Z"
from = "customer@example.com"
to = ["team@example.com"]
subject = "Team shared mailbox"
body_text = "Mail in the shared team mailbox."

# Lookup + read only: alice may see and read, not write.
[[acl]]
mailbox_id = "mbx-bob-inbox"
identifier = "account-alice"
rights = "lr"

# Everything short of `a` (administer): alice may store flags, insert,
# delete and expunge here.
[[acl]]
mailbox_id = "mbx-bob-projects"
identifier = "account-alice"
rights = "lrswipkxte"

# EWS public folders, same read-only / writable split.

[[public_folder]]
id = "pf-notices"
display_name = "Team Notices"
# effective_rights omitted -> the read-only default.

[[public_folder]]
id = "pf-drafts"
display_name = "Team Drafts"
effective_rights = { read = true, create_contents = true, create_associated = true, create_hierarchy = true, modify = true, delete = true }

[[public_item]]
id = "pi-notice-001"
folder_id = "pf-notices"
subject = "Read-only notice"
from = "facilities@example.com"
body_text = "Posted to the read-only public folder."
received_at = "2026-02-03T08:00:00Z"
