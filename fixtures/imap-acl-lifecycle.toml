name = "imap-acl-lifecycle"

# Shared-folder ACL lifecycle, driven mid-run through the change
# script. Two accounts: `alice` is primary (a default IMAP connection
# binds to her), `bob` owns two mailboxes.
#
# At load:
#   - bob's INBOX is shared with alice -> visible as
#     `#user/bob@example.com/INBOX`
#   - bob's Projects is NOT shared -> invisible to alice
#
# Step "grant-projects" shares Projects (the post-attach ACL addition:
# a new shared mailbox granted after the account is already connected
# and syncing). Step "revoke-inbox" withdraws the INBOX grant (the ACL
# revocation: a shared mailbox the account could previously see is
# taken away mid-session). Both must be observable on the *same*
# connection, with no restart: the other-users namespace listing and
# SELECT both re-resolve grants from the live fixture.

[[account]]
id = "account-alice"
name = "alice@example.com"
is_personal = true
primary = true

[[account]]
id = "account-bob"
name = "bob@example.com"
is_personal = true

# Alice's own inbox. Untouched by either step - the personal namespace
# must not move when a shared grant does.

[[mailbox]]
id = "mbx-alice-inbox"
account_id = "account-alice"
name = "Inbox"
role = "inbox"
sort_order = 0

[[email]]
id = "email-alice-001"
mailbox_ids = ["mbx-alice-inbox"]
received_at = "2026-01-15T10:00:00Z"
from = "sender@example.com"
to = ["alice@example.com"]
subject = "Alice private"
body_text = "Alice's own inbox email."

# Bob's two mailboxes.

[[mailbox]]
id = "mbx-bob-inbox"
account_id = "account-bob"
name = "Inbox"
role = "inbox"
sort_order = 0

[[mailbox]]
id = "mbx-bob-projects"
account_id = "account-bob"
name = "Projects"
sort_order = 1

[[email]]
id = "email-bob-001"
mailbox_ids = ["mbx-bob-inbox"]
received_at = "2026-01-20T11:00:00Z"
from = "elsewhere@example.com"
to = ["bob@example.com"]
subject = "Bob shared"
body_text = "Bob's shared inbox email."

[[email]]
id = "email-bob-002"
mailbox_ids = ["mbx-bob-projects"]
received_at = "2026-01-21T09:30:00Z"
from = "pm@example.com"
to = ["bob@example.com"]
subject = "Project kickoff"
body_text = "Kickoff is Thursday."

# Baseline grant: bob's INBOX, read-only, revoked by step 2.

[[acl]]
mailbox_id = "mbx-bob-inbox"
identifier = "account-alice"
rights = "lr"

# Step 1: post-attach ACL addition. Projects becomes visible and
# selectable to alice without a reconnect.

[[change]]
id = "grant-projects"

[[change.acl_grant]]
mailbox_id = "mbx-bob-projects"
identifier = "account-alice"
rights = "lr"

# Step 2: ACL revocation. Bob's INBOX stops being listed and stops
# being selectable for alice.

[[change]]
id = "revoke-inbox"

[[change.acl_revoke]]
mailbox_id = "mbx-bob-inbox"
identifier = "account-alice"

# Step 3: the same revoke again. There is no grant left, so the step
# fails with 422 and the cursor stays put - the rewind path for an ACL
# op, asserted by the tests.

[[change]]
id = "revoke-inbox-again"

[[change.acl_revoke]]
mailbox_id = "mbx-bob-inbox"
identifier = "account-alice"
