name = "imap-shared"

# Two accounts. `alice` is primary, so a default IMAP connection
# binds to it. `bob` owns a mailbox he has shared with alice via an
# `[[acl]]` grant, exercising the IMAP other-users namespace
# (`#user/<owner>/<path>`) plus MYRIGHTS / GETACL.

[[account]]
id = "account-alice"
name = "alice@example.com"
is_personal = true
primary = true

[[account]]
id = "account-bob"
name = "bob@example.com"
is_personal = true

# Alice's own inbox.

[[mailbox]]
id = "mbx-alice-inbox"
account_id = "account-alice"
name = "Inbox"
role = "inbox"
sort_order = 0

[[email]]
id = "email-alice-001"
mailbox_ids = ["mbx-alice-inbox"]
received_at = "2026-01-15T10:00:00Z"
from = "sender@example.com"
to = ["alice@example.com"]
subject = "Alice private"
body_text = "Alice's own inbox email."

# Bob's inbox, one message. Shared read-only with alice below.

[[mailbox]]
id = "mbx-bob-inbox"
account_id = "account-bob"
name = "Inbox"
role = "inbox"
sort_order = 0

[[email]]
id = "email-bob-001"
mailbox_ids = ["mbx-bob-inbox"]
received_at = "2026-01-20T11:00:00Z"
from = "elsewhere@example.com"
to = ["bob@example.com"]
subject = "Bob shared"
body_text = "Bob's shared inbox email."

# Bob grants alice lookup+read on his inbox. Surfaces to alice as
# `#user/bob@example.com/INBOX`.

[[acl]]
mailbox_id = "mbx-bob-inbox"
identifier = "account-alice"
rights = "lr"
